<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>見積書・請求書 自動生成</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero no-print">
        <div>
          <p class="eyebrow">Invoice Studio</p>
          <h1>見積書・請求書 自動生成</h1>
          <p class="lead">案件情報を入力するだけで、見積書と請求書を同時に作成。入力内容はブラウザ内に保存されます。</p>
          <div class="privacy-note">
            外部送信なし。入力内容はこのブラウザ内にのみ保存されます。共有PCでは使用後に保存データを削除してください。
            <button type="button" id="clearDataButton">保存データを削除</button>
          </div>
        </div>
        <div class="doc-status" id="status">READY</div>
      </header>

      <section class="layout">
        <form class="control-panel no-print" id="invoiceForm">
          <div class="section-title">
            <span>01</span>
            <h2>基本情報</h2>
          </div>
          <label>
            <span>発行元名</span>
            <input name="issuer" value="りょうや AI Marketing Office" />
          </label>
          <label>
            <span>発行元住所・連絡先</span>
            <textarea name="issuerInfo" rows="3">東京都渋谷区
contact@example.com</textarea>
          </label>
          <div class="input-grid">
            <label>
              <span>登録番号</span>
              <input name="regNumber" value="T1234567890123" />
            </label>
            <label>
              <span>電話番号</span>
              <input name="tel" value="03-1234-5678" />
            </label>
          </div>
          <label>
            <span>クライアント名</span>
            <input name="client" value="株式会社ラッキーマイン" />
          </label>
          <div class="input-grid">
            <label>
              <span>税率</span>
              <select name="tax">
                <option value="0.1">10%</option>
                <option value="0.08">8%</option>
                <option value="0">なし</option>
              </select>
            </label>
            <label>
              <span>源泉徴収</span>
              <select name="withholding">
                <option value="0">なし</option>
                <option value="0.1021">10.21%</option>
              </select>
            </label>
          </div>
          <div class="input-grid">
            <label>
              <span>発行日</span>
              <input name="issueDate" type="date" />
            </label>
            <label>
              <span>振込期日</span>
              <input name="dueDate" type="date" />
            </label>
          </div>
          <label>
            <span>振込先</span>
            <textarea name="bank" rows="3">〇〇銀行 渋谷支店
普通 1234567
リョウヤ</textarea>
          </label>

          <div class="section-title compact">
            <span>02</span>
            <h2>明細</h2>
          </div>
          <div class="line-editor" id="lineEditor"></div>
          <button class="secondary full" type="button" id="addLineButton">明細を追加</button>

          <label>
            <span>備考</span>
            <textarea name="notes" rows="3">本書の有効期限は発行日より30日です。</textarea>
          </label>

          <div class="actions">
            <button class="secondary" type="button" id="sampleButton">サンプル入力</button>
            <button class="secondary" type="button" id="copyButton">内容をコピー</button>
            <button class="secondary" type="button" id="printButton">印刷 / PDF</button>
            <button type="submit">書類を生成</button>
          </div>
        </form>

        <section class="preview-area">
          <div class="doc-tabs no-print">
            <button class="tab is-active" type="button" data-doc="estimate">見積書</button>
            <button class="tab" type="button" data-doc="invoice">請求書</button>
          </div>
          <article class="paper" id="estimateDoc"></article>
          <article class="paper invoice-paper is-hidden" id="invoiceDoc"></article>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
